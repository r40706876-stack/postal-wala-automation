<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Postal Wala</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="GDS, MTS, Postman, PA के लिए फ्री ऐप: चित्रों वाले PO Guide नोट्स, असली PYQ, मॉक टेस्ट, GDS सैलरी, बोनस, बचत कैलकुलेटर, TD कमीशन, प्रमोशन चेकर, छुट्टियाँ।">
<meta name="theme-color" content="#232E5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Hind:wght@400;500;600;700&display=swap">
<style>
/* Layout: the Postal Wala notes look — cream airmail letter, navy + post-box red, stamp badges; one phone column + bottom tab bar.
   Single deliberate light look (matches the printed notes), so no dark palette. */
:root{
  --navy:#232E5C; --navy2:#2F3C75; --red:#D3302C; --red-d:#A92420; --gold:#F2B33D; --gold-d:#9A6A07; --teal:#127A6A;
  --paper:#FBF6EC; --card:#FFFFFF; --mint:#E4F2EE; --pink:#FCE9E6; --butter:#FFF3CF; --line:#E7DDCB; --ink:#1D2033; --muted:#5F6070;
  --f-disp:"Baloo 2","Hind",system-ui,sans-serif;
  --f-body:"Hind","Noto Sans Devanagari",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%;display:block}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.airmail{height:9px;background:repeating-linear-gradient(-45deg,var(--red) 0 13px,#fff 13px 19px,var(--navy) 19px 32px,#fff 32px 38px)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 112px}
/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px 12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.logo{flex:none;width:46px;height:46px;border-radius:12px;overflow:hidden;transform:rotate(-4deg);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.brand b{font:800 25px/1 var(--f-disp);color:var(--red);letter-spacing:-.01em;display:block}
.brand small{font-size:13px;color:var(--navy);font-weight:600}
.hdr-r{display:flex;gap:8px;align-items:center}
.lang{border:1.5px solid var(--navy);background:var(--card);color:var(--navy);border-radius:10px;padding:5px 10px;font:700 14px var(--f-disp);cursor:pointer}
/* insta strip like the notes */
.strip{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:14px;padding:10px 12px;text-decoration:none}
.strip .igi{flex:none;width:34px;height:34px;border-radius:10px;background:linear-gradient(45deg,#F9A825,#E53935 45%,#8E24AA);display:grid;place-items:center}
.strip .igi svg{width:20px;height:20px}
.strip p{font-size:13.5px;line-height:1.35;min-width:0}
.strip p b{font-family:var(--f-disp);font-size:15px;display:block}
.follow{flex:none;margin-left:auto;background:var(--gold);color:var(--navy);font:800 14px var(--f-disp);border-radius:999px;padding:5px 14px}
/* type */
h1,h2,h3{font-family:var(--f-disp);font-weight:800;text-wrap:balance;margin:0;color:var(--navy);letter-spacing:-.01em}
h1{font-size:30px;line-height:1.15}
h2{font-size:22px;line-height:1.2}
h3{font-size:18px;line-height:1.25}
p{margin:0}
.eyebrow{font:700 13px var(--f-disp);letter-spacing:.08em;color:var(--red);text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:14px}
.note{font-size:13.5px;color:var(--muted);line-height:1.45}
.stack{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:8px}
.more{font:700 15px var(--f-disp);color:var(--red);text-decoration:none;white-space:nowrap}
/* hero = notes cover */
.cover{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.cover .wm{position:absolute;right:-30px;top:30px;width:200px;height:200px;border:10px solid rgba(211,48,44,.07);border-radius:50%;pointer-events:none}
.cover .wm::after{content:"PW";position:absolute;inset:0;display:grid;place-items:center;font:800 70px var(--f-disp);color:rgba(211,48,44,.07)}
.big1{font:800 44px/0.95 var(--f-disp);color:var(--ink);letter-spacing:-.02em}
.big1 span{color:var(--red);display:block}
.ways{background:var(--navy);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ways b{font:700 15px var(--f-disp);color:var(--gold)}
.ways div{display:flex;flex-wrap:wrap;gap:6px}
.ways span{background:#fff;color:var(--navy);font:700 13px var(--f-disp);border-radius:999px;padding:2px 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--paper);border:1.5px dashed var(--line);border-radius:12px;padding:8px 10px}
.stat b{display:block;font:800 24px/1.1 var(--f-disp);color:var(--navy);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:12px 16px;font:800 17px var(--f-disp);cursor:pointer;text-decoration:none;text-align:center;line-height:1.2}
.btn-red{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red-d)}
.btn-gold{background:var(--gold);color:var(--navy);box-shadow:0 3px 0 #C98E1D}
.btn-navy{background:var(--navy);color:#fff;box-shadow:0 3px 0 #141B3B}
.btn-line{background:var(--card);color:var(--navy);border:1.5px solid var(--navy)}
.btn-sm{padding:7px 12px;font-size:15px;border-radius:10px;box-shadow:none}
.btn:active{transform:translateY(2px);box-shadow:none}
:is(.btn,.opt,.lang,.tab,.chip,.row-link,.ncard,input,select,summary):focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* ticker */
.ticker{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tk{flex:none;display:flex;flex-direction:column;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;text-decoration:none;color:var(--ink);min-width:120px}
.tk b{font:800 21px/1.15 var(--f-disp);color:var(--navy);font-variant-numeric:tabular-nums}
.tk span{font-size:12px;color:var(--muted);line-height:1.3}
.tk.hot{background:var(--pink);border-color:#F3C2BC}
.tk.hot b{color:var(--red)}
/* row list = notes cover clause list */
.rows{background:var(--mint);border-left:4px solid var(--teal);border-radius:14px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:440px){.rows{grid-template-columns:1fr}}
.row-link{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:10px;padding:9px 10px;text-decoration:none;color:var(--ink);min-width:0}
.row-link>span:last-child{min-width:0}
.row-link b{display:block;font:700 15.5px/1.2 var(--f-disp);color:var(--ink)}
.row-link small{font-size:13px;color:var(--muted);line-height:1.25;display:block}
.num{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:800 15px var(--f-disp);color:#fff;font-variant-numeric:tabular-nums}
.num svg{width:19px;height:19px}
.n-red{background:var(--red)} .n-navy{background:var(--navy)} .n-teal{background:var(--teal)} .n-gold{background:var(--gold);color:var(--navy)}
.row-link.dash{border:1.5px dashed var(--red)}
/* notes gallery */
.nrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;scroll-snap-type:x mandatory}
.ncard{flex:none;width:150px;scroll-snap-align:start;text-decoration:none;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;padding:0;text-align:left;font:inherit}
.ncard img{width:100%;aspect-ratio:1100/1555;object-fit:cover;object-position:top;background:var(--line)}
.ncard div{padding:6px 8px}
.ncard b{display:block;font:700 14px/1.2 var(--f-disp);color:var(--navy)}
.ncard small{font-size:12px;color:var(--muted)}
.stampbadge{flex:none;width:58px;height:58px;background:var(--red);color:#fff;display:grid;place-items:center;text-align:center;font:800 24px/0.9 var(--f-disp);
  -webkit-mask:radial-gradient(circle 4px at 4px 4px,#0000 98%,#000) -4px -4px/8px 8px;mask:radial-gradient(circle 4px at 4px 4px,#0000 98%,#000) -4px -4px/8px 8px}
.stampbadge small{display:block;font-size:9px;letter-spacing:.08em;font-weight:700}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.three button{border:2px solid var(--line);border-radius:12px;background:var(--card);padding:0;cursor:pointer;overflow:hidden;text-align:center;font:700 13px var(--f-disp);color:var(--navy)}
.three button.on{border-color:var(--red)}
.three img{aspect-ratio:1100/1555;object-fit:cover;object-position:top;width:100%}
.three span{display:block;padding:4px 2px}
.page{background:var(--card);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.page img{width:100%;height:auto}
.zoom-wrap{position:fixed;inset:0;background:rgba(17,20,36,.96);z-index:20;display:flex;flex-direction:column}
.zoom-bar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));color:#fff}
.zoom-bar b{font:700 16px var(--f-disp)}
.zoom-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom,0px)}
.zoom-scroll img{margin:0 auto;width:100%;max-width:none}
.zoom-scroll.z2 img{width:200%}
.zb{background:#fff;color:var(--navy);border:none;border-radius:10px;padding:6px 12px;font:800 15px var(--f-disp);cursor:pointer}
/* boxes from notes */
.oneline{background:var(--mint);border-radius:12px;padding:10px 12px;border-left:4px solid var(--teal)}
.oneline small{display:block;font:700 12px var(--f-disp);letter-spacing:.06em;color:var(--teal)}
.trap{background:var(--pink);border:1.5px dashed var(--red);border-radius:12px;padding:10px 12px}
.trap>b{font:800 16px var(--f-disp);color:var(--red)}
.trick{background:var(--butter);border-radius:12px;padding:10px 12px;font-weight:600;transform:rotate(-.6deg);box-shadow:0 2px 0 rgba(0,0,0,.06)}
.trick small{display:block;font:700 12px var(--f-disp);color:var(--gold-d);letter-spacing:.04em}
mark{background:var(--butter);color:inherit;padding:0 3px;border-radius:3px;font-weight:700}
.traps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:440px){.traps{grid-template-columns:1fr}}
.traps div{background:#fff;border-radius:10px;padding:8px 10px;font-size:15px;line-height:1.35}
.traps small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
/* cards & quiz */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.qtext{font:600 19px/1.4 var(--f-body);color:var(--ink)}
.qsub{font-size:14px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:500 16.5px var(--f-body);color:var(--ink);cursor:pointer}
.opt .l{flex:none;width:27px;height:27px;border-radius:50%;border:1.5px solid var(--navy);color:var(--navy);display:grid;place-items:center;font:800 14px var(--f-disp)}
.opt.sel{border-color:var(--navy);background:#EEF0FA}
.opt.sel .l{background:var(--navy);color:#fff}
.opt.ok{border-color:var(--teal);background:var(--mint)}
.opt.ok .l{background:var(--teal);border-color:var(--teal);color:#fff}
.opt.bad{border-color:var(--red);background:var(--pink)}
.opt.bad .l{background:var(--red);border-color:var(--red);color:#fff}
.exams{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ex{font:600 12px var(--f-body);color:var(--navy);border:1px solid #CCD2EA;border-radius:6px;padding:1px 7px;background:#F1F3FB}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar>div{height:100%;background:var(--red);border-radius:8px;transition:width .25s}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 130px}
.timer{font:800 18px var(--f-disp);color:var(--red);font-variant-numeric:tabular-nums}
.navyband{background:var(--navy);color:#fff;border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.navyband h1,.navyband h2{color:#fff}
.navyband p{color:#D8DCF0}
.navyband .eyebrow{color:var(--gold)}
.result{text-align:center;align-items:center}
.cancel{width:150px;height:150px;border-radius:50%;border:4px double var(--gold);display:grid;place-items:center;transform:rotate(-8deg);color:#fff}
.cancel b{font:800 42px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.cancel span{font:700 12px var(--f-disp);letter-spacing:.08em;color:var(--gold)}
.navyband .stat{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
.navyband .stat b{color:#fff}
.navyband .stat span{color:#C9CFEB}
.streak{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.1);border-radius:12px;padding:10px 14px}
.streak b{font:800 32px/1 var(--f-disp);color:var(--gold)}
/* forms + tools */
.search,.inp{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;font:16px var(--f-body)}
label.f{display:flex;flex-direction:column;gap:4px;font:700 14px var(--f-disp);color:var(--navy);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font:700 14px var(--f-disp);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.out{background:var(--navy);color:#fff;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.out .big{font:800 36px/1.1 var(--f-disp);font-variant-numeric:tabular-nums}
.out .lbl{font:700 13px var(--f-disp);letter-spacing:.06em;color:var(--gold);text-transform:uppercase}
.kv{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums;padding:6px 0;border-bottom:1px dashed var(--line)}
.out .kv{border-color:rgba(255,255,255,.2)}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--muted)}
.out .kv span:first-child{color:#C9CFEB}
.kv b{font-weight:700;text-align:right}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 12px var(--f-disp);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
td b{color:var(--navy)}
.rate{font:800 18px var(--f-disp);color:var(--teal);white-space:nowrap}
.hol{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.hol:last-child{border-bottom:none}
.hd{flex:none;width:52px;text-align:center;border-radius:10px;border:1.5px solid var(--line);padding:4px 0;line-height:1.05;background:var(--paper)}
.hd b{display:block;font:800 21px var(--f-disp);color:var(--navy)}
.hd span{font:700 11px var(--f-disp);color:var(--red);text-transform:uppercase}
.hol.past{opacity:.45}
.hol.next .hd{border-color:var(--red);background:var(--pink)}
.pill{display:inline-block;font:700 12px var(--f-disp);border-radius:999px;padding:2px 9px;white-space:nowrap}
.p-ok{background:var(--mint);color:var(--teal)} .p-no{background:var(--pink);color:var(--red)} .p-wait{background:var(--butter);color:var(--gold-d)}
.elig{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.elig:last-child{border-bottom:none}
.elig>div{min-width:0;flex:1}
.elig b{font-family:var(--f-disp)}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--navy);font:700 15px var(--f-disp);width:fit-content}
.thead{display:flex;gap:12px;align-items:center}
details.cl{background:var(--card);border:1.5px solid var(--line);border-radius:14px}
details.cl summary{list-style:none;display:flex;gap:12px;align-items:center;padding:10px 12px;cursor:pointer}
details.cl summary::-webkit-details-marker{display:none}
.ct{min-width:0;flex:1}
.ct b{display:block;font:700 17px/1.25 var(--f-disp);color:var(--navy)}
.ct span{font-size:13px;color:var(--muted)}
.cbody{padding:0 12px 12px;display:flex;flex-direction:column;gap:12px}
.done-tag{color:var(--teal);font-weight:700}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs::before{content:"";position:absolute;left:0;right:0;top:-5px;height:4px;background:repeating-linear-gradient(-45deg,var(--red) 0 10px,#fff 10px 14px,var(--navy) 14px 24px,#fff 24px 28px)}
.tab{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px 7px;text-decoration:none;color:var(--muted);font:700 12.5px var(--f-disp)}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--red)}
.tab.on svg{stroke-width:2.3}
footer{font-size:13px;color:var(--muted);text-align:center;padding-top:16px;line-height:1.5}
footer a{color:var(--red);font-weight:700}
.cont{display:flex;align-items:center;gap:12px;background:var(--red);color:#fff;border-radius:14px;padding:12px 14px;text-decoration:none;box-shadow:0 3px 0 var(--red-d)}
.cont .num{background:#fff;color:var(--red)}
.cont b{font:800 17px/1.2 var(--f-disp);display:block}
.cont small{font-size:13.5px;opacity:.9}
.cont .arrow{margin-left:auto;font:800 22px var(--f-disp)}
.role{background:var(--butter);border:1.5px solid #EED48A;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.role .opts2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.role button{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:12px;padding:10px;font:700 15.5px/1.25 var(--f-disp);cursor:pointer}
.spk{flex:none;border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:3px 10px;font:700 13.5px var(--f-disp);cursor:pointer;display:inline-flex;align-items:center;gap:4px;width:fit-content}
.spk.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.wa{background:#1FA855;color:#fff;box-shadow:0 3px 0 #13813F}
.expl{border:1.5px solid var(--teal);border-radius:12px;overflow:hidden;background:var(--mint)}
.expl .eh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;font:700 13.5px var(--f-disp);color:var(--teal)}
.crop{display:block;width:100%;border-top:1px dashed #B9DED5!important;background-repeat:no-repeat;background-color:#fff;border:none;padding:0;cursor:zoom-in}
.expl .row{padding:8px 10px}
.srch{position:relative}
.srch input{padding-left:38px}
.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.res{display:flex;flex-direction:column;gap:6px}
.res a{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;text-decoration:none;color:var(--ink)}
.res a span:last-child{min-width:0}
.res b{font:700 15px/1.25 var(--f-disp);color:var(--navy);display:block}
.res small{font-size:13px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.modes{grid-template-columns:1fr}}
.mode{display:flex;flex-direction:column;gap:2px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;font:inherit;color:var(--ink)}
.mode b{font:800 18px/1.2 var(--f-disp);color:var(--navy)}
.mode small{font-size:13.5px;color:var(--muted)}
.mode.hot{border-color:var(--red);background:var(--pink)}
.mode.hot b{color:var(--red)}
#app{zoom:var(--z,1)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

let run=null,timerId=null;
function startRun(kind,qs,secs){clearInterval(timerId);run={kind,qs,ans:Array(qs.length).fill(null),i:0,end:secs?Date.now()+secs*1000:0,done:false};
 if(secs)timerId=setInterval(()=>{const el=$("#tmr");if(!run||run.done){clearInterval(timerId);return}const left=run.end-Date.now();if(left<=0){finish();return}if(el)el.textContent=fmt(left)},500);
 draw()}
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return pad2(Math.floor(s/60))+":"+pad2(s%60)};
function qBlock(q,chosen,reveal){
 return `<div class="opts">${q.o.map((o,j)=>{let c="opt";if(reveal){if(j===q.a)c+=" ok";else if(j===chosen)c+=" bad"}else if(j===chosen)c+=" sel";
  return `<button class="${c}" type="button" data-j="${j}" ${reveal?"disabled":""}><span class="l">${AB[j]}</span><span>${esc(o)}</span></button>`}).join("")}</div>`}
function examLine(q){return q.x&&q.x.length?`<div class="exams"><span class="qsub">${t("askedIn")}</span>${q.x.map(e=>`<span class="ex">${esc(e)}</span>`).join("")}</div>`:""}
function draw(){
 const app=$("#app");
 if(run.done){app.innerHTML=resultView();bindResult();return}
 const q=run.qs[run.i],n=run.qs.length,instant=run.kind!=="mock",reveal=instant&&run.ans[run.i]!=null;
 app.innerHTML=`<div class="stack"><div class="qmeta"><span>${t("q")} <b>${run.i+1}</b> ${t("of")} ${n}</span>${run.end?`<span class="timer" id="tmr">${fmt(run.end-Date.now())}</span>`:""}</div>
 <div class="bar"><div style="width:${(run.i+1)/n*100}%"></div></div>
 <div class="card"><p class="qtext">${esc(qText(q))}</p>${L==="en"&&q.e?`<p class="qsub">${esc(q.q)}</p>`:""}${spk(qText(q)+"। "+q.o.map((o,j)=>AB[j]+", "+o).join("। "))}${qBlock(q,run.ans[run.i],reveal)}${reveal?examLine(q)+(run.ans[run.i]===q.a?(q.f?`<div class="oneline"><small>${t("rule")}</small>${esc(q.f)}</div>`:""):explain(q))+(q.y?`<div class="trick"><small>${t("trick")}</small>${esc(q.y)}</div>`:""):""}</div>
 <div class="row">${run.i>0&&!instant?`<button class="btn btn-line" id="prev" type="button">${t("prev")}</button>`:""}
 ${run.i<n-1?`<button class="btn btn-navy" id="next" type="button">${run.ans[run.i]==null&&!instant?t("skip"):t("next")} →</button>`:`<button class="btn btn-red" id="sub" type="button">${t("submit")}</button>`}</div></div>`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{run.ans[run.i]=+b.dataset.j;draw()});
 const nx=$("#next");if(nx)nx.onclick=()=>{run.i++;draw();scrollTo(0,0)};
 const pv=$("#prev");if(pv)pv.onclick=()=>{run.i--;draw()};
 const sb=$("#sub");if(sb)sb.onclick=finish;
}
function finish(){if(!run||run.done)return;run.done=true;clearInterval(timerId);
 const g=store.get("galti",{});run.qs.forEach((q,i)=>{const id=qid(q);if(run.ans[i]===q.a)delete g[id];else if(run.ans[i]!=null)g[id]=1});store.set("galti",g);
 if(run.kind==="quiz"){const today=new Date().toDateString();const s=store.get("streak",{n:0,last:""});
  if(s.last!==today){const y=new Date(Date.now()-dayMs).toDateString();s.n=s.last===y?s.n+1:1;s.last=today;store.set("streak",s)}}
 draw();scrollTo(0,0)}
function resultView(){
 const n=run.qs.length,c=run.qs.filter((q,i)=>run.ans[i]===q.a).length,sk=run.ans.filter(a=>a==null).length,w=n-c-sk;
 const pct=c/n,msg=t("msgs")[pct>=.7?0:pct>=.4?1:2];
 const txt=`${t("shareTxt")}: ${c}/${n} 📮 ${IG}`;
 return `<div class="stack"><section class="navyband result"><div class="cancel"><div><b>${c}/${n}</b><br><span>${t("score").toUpperCase()}</span></div></div>
 <h2>${msg}</h2><div class="stats" style="width:100%"><div class="stat"><b>${c}</b><span>${t("correct")}</span></div><div class="stat"><b>${w}</b><span>${t("wrong")}</span></div><div class="stat"><b>${sk}</b><span>${t("left")}</span></div></div>
 <div class="row" style="width:100%">${waBtn(tf("waScore",{c,n})+" "+SITE)}${run.kind==="mock"?`<button class="btn btn-gold" id="again" type="button">${t("again")}</button>`:""}</div>
 <button class="btn btn-line btn-sm" id="cp" type="button" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.4)">${t("copy")}</button>
 <p class="small" id="cpt" hidden>${esc(txt)}</p></section>
 ${run.kind==="quiz"?`<p class="muted" style="text-align:center">${t("done")}</p>`:""}
 ${strip()}<h2>${t("review")}</h2>
 ${run.qs.map((q,i)=>`<div class="card"><div class="qmeta"><span>${t("q")} ${i+1}</span><span class="pill ${run.ans[i]===q.a?"p-ok":run.ans[i]==null?"p-wait":"p-no"}">${run.ans[i]===q.a?"✓ "+t("correct"):run.ans[i]==null?t("left"):"✗ "+t("wrong")}</span></div><p class="qtext">${esc(qText(q))}</p>${qBlock(q,run.ans[i],true)}${examLine(q)}${run.ans[i]===q.a?(q.f?`<div class="oneline"><small>${t("rule")}</small>${esc(q.f)}</div>`:""):explain(q)}</div>`).join("")}</div>`}
function bindResult(){const cp=$("#cp");if(cp)cp.onclick=()=>copyText($("#cpt").textContent,cp,$("#cpt"));
 const ag=$("#again");if(ag)ag.onclick=()=>{run=null;route()}}

const SCH=[

 {id:"ssa",hi:"सुकन्या समृद्धि (SSA) – 21 साल",en:"Sukanya Samriddhi (SSA) – 21 yrs",kind:"yearly",def:150000,rate:R.ssa}];
function calcScheme(s,a){const r=s.rate/100,H=L==="hi";
 if(s.id==="rd"){let m=0;for(let i=1;i<=60;i++)m+=a*Math.pow(1+r/4,i/3);return {dep:a*60,mat:m,rows:[[t("years"),H?"5 साल (60 किस्त)":"5 yrs (60 instalments)"]]}}
 if(s.id.startsWith("td")){const yi=a*(Math.pow(1+r/4,4)-1);return {dep:a,mat:a+yi*s.n,rows:[[t("yearlyInt"),inr(yi)],[t("years"),s.n+(H?" साल":" yrs")]]}}
 if(s.id==="mis"){const mi=a*r/12;return {dep:a,mat:a+mi*60,rows:[[t("monthlyInt"),inr(mi)],[t("years"),H?"5 साल, फिर मूलधन वापस":"5 yrs, then principal back"]]}}
 if(s.id==="scss"){const qi=a*r/4;return {dep:a,mat:a+qi*20,rows:[[t("quarterlyInt"),inr(qi)],[t("years"),H?"5 साल":"5 yrs"]]}}
 if(s.id==="nsc")return {dep:a,mat:a*Math.pow(1+r,5),rows:[[t("years"),H?"5 साल":"5 yrs"]]};
 if(s.id==="kvp")return {dep:a,mat:a*2,rows:[[t("years"),R.kvpMonths+(H?" महीने में दोगुना":" months, doubles")]]};
 if(s.id==="ppf"){let v=0;for(let y=0;y<15;y++)v=(v+a)*(1+r);return {dep:a*15,mat:v,rows:[[t("years"),H?"15 साल जमा":"15 yrs deposit"]]}}
 if(s.id==="ssa"){let v=0;for(let y=0;y<21;y++){if(y<15)v+=a;v*=1+r}return {dep:a*15,mat:v,rows:[[t("years"),H?"15 साल जमा, 21 साल पर मैच्योर":"15 yrs deposit, matures at 21 yrs"]]}}}

const canSpeak=(()=>{try{return "speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined"}catch(e){return false}})();
let speakingBtn=null;
function speak(text,btn){if(!canSpeak)return;const ss=window.speechSynthesis;
 if(speakingBtn===btn&&ss.speaking){ss.cancel();btn.classList.remove("on");btn.innerHTML="🔊 "+t("say");speakingBtn=null;return}
 ss.cancel();if(speakingBtn){speakingBtn.classList.remove("on");speakingBtn.innerHTML="🔊 "+t("say")}
 const u=new SpeechSynthesisUtterance(text);const hindi=/[ऀ-ॿ]/.test(text);u.lang=hindi?"hi-IN":"en-IN";u.rate=.92;
 const v=ss.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith(hindi?"hi":"en-in"));if(v)u.voice=v;
 u.onend=u.onerror=()=>{if(btn){btn.classList.remove("on");btn.innerHTML="🔊 "+t("say")}speakingBtn=null};
 speakingBtn=btn;if(btn){btn.classList.add("on");btn.innerHTML="⏹ "+t("stop")}ss.speak(u)}

 <h2>${t("mPaper")}</h2><p class="note">${t("mPaperS")}</p><div class="chips" style="flex-wrap:wrap">${papers.map(([e,n])=>`<button class="chip" type="button" data-paper="${esc(e)}">${esc(e)} · ${n}</button>`).join("")}</div>
 <h2>${t("mClause")}</h2><p class="note">${t("mClauseS")}</p><div class="chips" style="flex-wrap:wrap">${DATA.clauses.map(c=>`<button class="chip" type="button" data-cl="${c.n}">${c.n} · ${esc((L==="hi"?c.h||c.t:c.t).slice(0,22))}</button>`).join("")}</div>
 ${strip()}</div>`}
function bindModes(){
 document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{const n=+b.dataset.mode;startRun("mock",shuffle(DATA.pyq).slice(0,n),n===10?600:1200)});
 document.querySelectorAll("[data-paper]").forEach(b=>b.onclick=()=>{const qs=shuffle(DATA.pyq.filter(q=>q.x.includes(b.dataset.paper)));startRun("mock",qs,Math.max(300,qs.length*48))});
 document.querySelectorAll("[data-cl]").forEach(b=>b.onclick=()=>{const c=DATA.clauses.find(x=>x.n===+b.dataset.cl);const qs=shuffle(c.p.map(p=>({...p,x:[],c:c.n})));startRun("mock",qs,Math.max(180,qs.length*45))})}

/* ---------- ROUTER ---------- */
const VIEWS=["home","notes","study","mock","pyq","course","quiz","galti","tools","search",...TOOLS.map(x=>x[0])];
function bindInputs(sel,fn){document.querySelectorAll(sel).forEach(el=>{el.oninput=fn;el.onchange=fn});fn()}
function route(){
 const v=(location.hash||"#home").slice(1);
 const isNote=v.startsWith("note-");const view=isNote?"note":VIEWS.includes(v)?v:"home";
 renderTabs(view);const app=$("#app");
 if((view==="mock"||view==="quiz")&&run&&run.kind===view){draw();return}
 if(run&&run.kind!==view){clearInterval(timerId);run=null}
 const R2={home,notes:notesView,study:studyView,tools:toolsView,course:courseView,exam:examView,links:linksView,rates:ratesView,hol:holView};
 if(R2[view])app.innerHTML=R2[view]();
 if(view==="note"){const id=v.slice(5);app.innerHTML=noteView(id);
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{noteTab[id]=b.dataset.tab;route()});
  const n=NOTES.find(x=>String(x.n)===id);const cl=n&&DATA.clauses.find(x=>x.n===n.n);if(cl)bindPractice(app,cl.p.slice(0,3))}
 remember(isNote?v:view);
 if(view==="home"){const ib=$("#inst");if(ib)ib.onclick=()=>{deferredInstall.prompt();deferredInstall=null;route()}}
 if(view==="search"){app.innerHTML=searchView();$("#sq").oninput=searchRun;searchRun();setTimeout(()=>{try{$("#sq").focus()}catch(e){}},50)}
 if(view==="mock"){app.innerHTML=mockModes();bindModes()}
 if(view==="quiz"){app.innerHTML=quizIntro();$("#go").onclick=()=>{const qs=dailyQs();startRun("quiz",qs,0);
   if(store.get("streak",{}).last===new Date().toDateString()){run.ans=qs.map(q=>q.a);run.done=true;draw()}}}
 if(view==="galti"){app.innerHTML=galtiView();const gp=$("#gp");if(gp)gp.onclick=()=>{const g=store.get("galti",{});startRun("galti",shuffle(allQs().filter(q=>g[qid(q)])).slice(0,25),0)}}
 if(view==="pyq"){app.innerHTML=pyqView();pyqList();
  $("#srch").oninput=e=>{pf.s=e.target.value;pyqList()};
  $("#chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{pf.st=b.dataset.st;$("#chips").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));pyqList()})}
 if(view==="course")app.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{const d=store.get("done",[]);d.push(+b.dataset.done);store.set("done",[...new Set(d)]);route()});
 if(view==="salary"){app.innerHTML=salaryView();$("#s_slab").onchange=()=>{$("#s_basic").value=INFO.trca.find(s=>s.id===$("#s_slab").value).min;salaryCalc()};$("#s_basic").oninput=salaryCalc;salaryCalc()}
 if(view==="bonus"){app.innerHTML=bonusView();bindInputs("#b_amt,#b_m",bonusCalc)}
 if(view==="savings"){app.innerHTML=savingsView();$("#v_id").onchange=savingsCalc;$("#v_a").oninput=savingsCalc;savingsCalc();$("#v_cp").onclick=e=>copyText($("#v_txt").textContent,e.currentTarget,$("#v_txt"))}
 if(view==="td"){app.innerHTML=tdView();bindInputs(".td-a,.td-n",tdCalc);
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const r=tdRead();r.splice(+b.dataset.rm,1);store.set("td",r);route()});
  $("#td_add").onclick=()=>{const r=tdRead();r.push({a:100000,n:5});store.set("td",r);route()}}
 if(view==="career"){app.innerHTML=careerView();bindInputs("#c_post,#c_yr,#c_join,#c_dob,#c_edu,#c_cat",careerCalc)}
 if(view==="pay8"){app.innerHTML=pay8View();$("#p_b").oninput=pay8Calc;$("#p_f").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{$("#p_f").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));pay8Calc()});pay8Calc()}
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-zoom]");if(b){e.preventDefault();openZoom(b.dataset.zoom,b.dataset.title)}});
$("#langBtn").onclick=()=>{L=L==="hi"?"en":"hi";store.set("lang",L);route()};
addEventListener("hashchange",()=>{scrollTo(0,0);route()});
route();
</script>

<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
