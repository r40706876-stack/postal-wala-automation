name: Publish source-verified doubts ep04 at 18:30 IST
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: postal-doubts-instagram-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: production
          sparse-checkout: doubts_publish
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          path: core
          sparse-checkout: |
            ig_post.py
            branding.py
            brand_config.json
            generated_reels/ig_posted.json
            doubts_reels/ep01_publication_receipt.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -q requests pillow
      - name: Verify account, assets and duplicates then publish exact episode
        working-directory: core
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_POST: '0'
        run: python -u ../production/doubts_publish/publish_ep04.py
      - name: Persist actual publication receipt and merge fresh deduplication state
        if: always()
        working-directory: core
        env:
          CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
        run: python -u ../production/doubts_publish/persist_episode04_20261120.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Postal-Doubts-Publication-Receipt
          path: core/doubts_reels/ep04_publication_receipt.json
          if-no-files-found: ignore

# Exactly episode04 after Concierge10 narration and approved2D visual QA; no early/late publish.
