name: Build GDS leave episode voice
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/leave_episode_voice.yml'
permissions:
  contents: write
concurrency:
  group: postal-leave-voice
  cancel-in-progress: false
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Dependencies
        run: pip install -q requests numpy pillow edge-tts pypdf faster-whisper
      - name: Build narrated episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          MEDIA_REPO: ${{ github.repository }}
        run: |
          python -u - <<'PY'
          import os,json,wave,base64,urllib.request,numpy as np
          import main as M
          import bharosa as B
          from deep import deep_demo as D
          lines=[
          ["hook","जीडीएस की बची छुट्टी का पैसा मिलता है क्या?"],
          ["save","ये ज़रूरी नियम है, इसलिए वीडियो पहले ही सेव कर लो।"],
          ["credit","पहले हिसाब समझो। साल में बीस दिन पेड लीव, हर छमाही दस दिन।"],
          ["calendar","दस दिन, एक जनवरी को। और दस दिन, एक जुलाई को जुड़ते हैं।"],
          ["carry","बची पेड लीव आगे ले जा सकते हो। लेकिन कैरी फॉरवर्ड की सीमा पैंतालीस दिन है।"],
          ["cash","पर छुट्टी बचाने का मतलब पैसा लेना नहीं। पेड लीव का नकद भुगतान नहीं मिलता।"],
          ["approval","एक साथ छुट्टी चाहिए? खाते में छुट्टी और सक्षम अधिकारी की मंज़ूरी, दोनों ज़रूरी हैं।"],
          ["summary","याद रखो। साल में बीस दिन। आगे पैंतालीस तक। नकद भुगतान नहीं।"],
          ["cta","डाक विभाग के डाउट्स। अगला विषय, जॉइनिंग डेट या कटऑफ? रोज़ शाम साढ़े छह बजे, पोस्टल वाला।"]
          ]
          voices=D.one_take(lines)
          assert len(voices)==len(lines)
          cues=[];t=.2;parts=[np.zeros(int(.2*M.SR),dtype=np.float32)]
          for (key,text),a in zip(lines,voices):
              dur=len(a)/M.SR
              ws=text.split(); weights=[max(1,len(w)) for w in ws];den=sum(weights);acc=0;words=[]
              for w,weight in zip(ws,weights):
                  words.append({"t":dur*acc/den,"s":w});acc+=weight
              cues.append({"key":key,"text":text,"t":round(t,3),"d":round(dur,3),"words":words})
              parts.extend([a,np.zeros(int(.1*M.SR),dtype=np.float32)]);t+=dur+.1
          a=np.concatenate(parts)
          path='/tmp/leave_voice.wav'
          with wave.open(path,'wb') as f:
              f.setnchannels(1);f.setsampwidth(2);f.setframerate(M.SR);f.writeframes((np.clip(a,-1,1)*32767).astype('<i2').tobytes())
          data={'voice.wav':open(path,'rb').read(),'cues.json':json.dumps(cues,ensure_ascii=False).encode()}
          hdr={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          for name,raw in data.items():
              ep='https://api.github.com/repos/'+os.environ['MEDIA_REPO']+'/contents/episodes/ep03_leave/'+name
              body={'branch':'media','message':'Episode 03 narrated production asset','content':base64.b64encode(raw).decode()}
              try:
                  with urllib.request.urlopen(urllib.request.Request(ep+'?ref=media',headers=hdr)) as r:body['sha']=json.load(r)['sha']
              except Exception:pass
              with urllib.request.urlopen(urllib.request.Request(ep,data=json.dumps(body).encode(),headers=hdr,method='PUT')) as r:result=json.load(r)
              print('READY',name,result['commit']['sha'],flush=True)
          print('VOICE_DONE',t,flush=True)
          PY
