name: GDS doubts ep02 - verified process (Gemini only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/doubts_ep02.yml'
permissions:
  contents: write
concurrency:
  group: postal-doubts-ep02
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Renderer dependencies
        timeout-minutes: 5
        run: |
          sudo timeout 90 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update -qq
          sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y --no-install-recommends ffmpeg fonts-noto-core libraqm0 poppler-utils
          pip install requests pypdf pillow numpy edge-tts playwright==1.47.0 faster-whisper
          timeout 120 python -m playwright install --with-deps chromium
      - name: Build ep02 with Gemini one-take voice (tries every Gemini key)
        env:
          K1: ${{ secrets.GEMINI_API_KEY4 || secrets.GEMINI_API_KEY_4 }}
          K2: ${{ secrets.GEMINI_API_KEY2 || secrets.GEMINI_API_KEY_2 }}
          K3: ${{ secrets.GEMINI_API_KEY3 || secrets.GEMINI_API_KEY_3 }}
          K4: ${{ secrets.GEMINI_DEEP_KEY }}
          K5: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: gemini-3.8-flash-tts
          GEMINI_TTS_VOICE: hi-in-training-1
          DEEP_PER_LINE: '0'
          DEEP_STRICT_ONE_TAKE: '1'
          DEEP_FAST_QUOTA_FAIL: '1'
          DEEP_VOICE_CACHE: doubts_reels/voice_cache
          DEEP_TAKE: doubts_reels/ep02_source_locked_20261118.wav
          DEEP_TAKE_SAVE: doubts_reels/ep02_source_locked_20261118.wav
          DEEP_GAP_LINE: '0.08'
          DEEP_GAP_SCENE: '0.18'
        run: |
          set -uo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('deep/deep_demo.py')
          s=p.read_text();s=s.replace('M.TTS_WAITS = (30, 60) if os.getenv("DEEP_FAST_QUOTA_FAIL") == "1" else (40, 70, 100, 140, 180)', 'M.TTS_WAITS = ()  # bounded quota retry for this build')
          p.write_text(s)
          PY
          ok=0
          for n in 1 2 3 4 5; do
            v="K$n"; key="${!v:-}"
            [ -z "$key" ] && { echo "key $n khali"; continue; }
            echo "=== Gemini key $n ==="
            if GEMINI_API_KEY="$key" python doubts_ep02.py; then ok=1; break; fi
          done
          [ "$ok" = 1 ] || { echo "Sabhi Gemini keys ka TTS quota khatam"; exit 1; }
          ffmpeg -y -v error -i doubts_reels/ep02_transfer_kram.mp4 -vf "fps=1/4,scale=216:384,tile=5x3" -frames:v 1 doubts_reels/ep02_contact.jpg
      - name: Save in core
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doubts_reels
          git diff --cached --quiet || git commit -m "GDS doubts ep02 preview [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep 5; done
      - name: Publish preview media for user review
        env:
          MEDIA_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,urllib.request
          from pathlib import Path
          root=Path('doubts_reels')
          hdr={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          for name in ['ep02_transfer_kram.mp4','ep02_contact.jpg','ep02_transfer_kram_caption.txt','ep02_transfer_kram.mp4.cues.json']:
              p=root/name
              if not p.exists(): continue
              ep='https://api.github.com/repos/'+os.environ['MEDIA_REPO']+'/contents/doubts-preview/'+name
              body={'message':'GDS doubt ep02 preview '+name,'branch':'media','content':base64.b64encode(p.read_bytes()).decode()}
              try:
                  with urllib.request.urlopen(urllib.request.Request(ep+'?ref=media',headers=hdr)) as r: body['sha']=json.load(r)['sha']
              except Exception: pass
              with urllib.request.urlopen(urllib.request.Request(ep,data=json.dumps(body).encode(),headers=hdr,method='PUT')) as r: d=json.load(r)
              print('PREVIEW_READY https://raw.githubusercontent.com/'+os.environ['MEDIA_REPO']+'/'+d['commit']['sha']+'/doubts-preview/'+name)
          PY
