name: Postal Wala Daily Reel Automation

on:
  workflow_dispatch:
  schedule:
    # 4 Daily Peak Slots (IST): 09:00 AM, 01:15 PM, 06:00 PM, 08:45 PM
    - cron: '30 3 * * *'   # 09:00 AM IST
    - cron: '45 7 * * *'   # 01:15 PM IST
    - cron: '30 12 * * *'  # 06:00 PM IST
    - cron: '15 15 * * *'  # 08:45 PM IST

# ek run khatam hone se pehle doosra shuru na ho (state kharab na ho)
concurrency:
  group: postal-wala-reel
  cancel-in-progress: false

jobs:
  build-and-post:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation libraqm0

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pypdf pillow numpy edge-tts

      - name: Run Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python main.py

      - name: Save and Commit Generated Reels & Progress
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p generated_reels clause_plans
          git add progress_state.json generated_reels/ clause_plans/
          git diff --staged --quiet || git commit -m "Add generated reels and update progress state [skip ci]"
          git pull --rebase origin main || echo "Rebase not needed"
          git push origin main || git push
