name: Postal Wala Daily Reel Automation

on:
  workflow_dispatch: # जब चाहें बटन दबाकर तुरंत खुद चलाने के लिए
  schedule:
    # दिन की 4 सबसे असरदार वायरल टाइमिंग्स (IST):
    - cron: '30 3 * * *'   # 1. सुबह 09:00 AM IST (03:30 AM UTC)
    - cron: '45 7 * * *'   # 2. दोपहर 01:15 PM IST (07:45 AM UTC)
    - cron: '30 12 * * *'  # 3. शाम 06:00 PM IST (12:30 PM UTC)
    - cron: '15 15 * * *'  # 4. रात 08:45 PM IST (03:15 PM UTC)

jobs:
  build-and-post:
    runs-on: ubuntu-latest

    permissions:
      contents: write # progress_state.json को ऑटो-सेव करने की अनुमति

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Install Python Packages
        run: |
          pip install requests pypdf pillow groq edge-tts

      - name: Run Automation Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python main.py

      - name: Save and Commit Progress State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add progress_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update progress state [skip ci]" && git pull --rebase && git push)
