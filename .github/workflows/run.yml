name: Postal Wala Daily Reel

on:
  schedule:
    - cron: '30 2 * * *' # रोज़ सुबह 8:00 बजे (IST) ऑटोमैटिक रन होगा
  workflow_dispatch: # आप इसे मैन्युअली भी रन कर सकते हैं

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Linux Fonts
        run: |
          python -m pip install --upgrade pip
          pip install requests pypdf pillow groq edge-tts
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Run Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python main.py

      - name: Save Reading Progress
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📥 Auto-update reading progress & state [skip ci]"
          file_pattern: progress_state.json
