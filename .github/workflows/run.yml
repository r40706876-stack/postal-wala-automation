name: Postal Wala Daily Reel

on:
  workflow_dispatch: # मैन्युअल रन करने के लिए
  schedule:
    - cron: '30 3 * * *' # रोज़ सुबह 9:00 AM IST (3:30 AM UTC)

jobs:
  build-and-post:
    runs-on: ubuntu-latest

    permissions:
      contents: write # progress_state.json को वापस सेव करने के लिए ज़रूरी है

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Install Python Packages
        run: |
          pip install requests pypdf pillow groq edge-tts

      - name: Run Automation Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python main.py

      - name: Save and Commit Progress State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add progress_state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update progress state [skip ci]"
          git push
