name: Postal Wala Daily Reel Automation

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Kaunsi reel banani hai"
        type: choice
        options: [series, am, pm, check]
        default: series
  schedule:
    # v22: din ke 3 slot (IST) - reel post ke time se ~30 min pehle taiyar
    # ghante ke beech ka minute (GitHub :00 wale schedule aksar der se chalata/chhod deta hai); reel banke
    # post ke time tak run rukta hai
    - cron: '13 1 * * *'   # 06:43 AM IST -> 8 AM wali 7 PYQ quiz reel
    - cron: '13 10 * * *'  # 03:43 PM IST -> 5 PM wali clause series reel (+ saathi PYQ)
    - cron: '13 14 * * *'  # 07:43 PM IST -> 9 PM wali 7 PYQ copy-panna reel + carousel

# ek run khatam hone se pehle doosra shuru na ho (state kharab na ho)
concurrency:
  group: postal-wala-reel
  cancel-in-progress: false

jobs:
  build-and-post:
    runs-on: ubuntu-24.04          # pakka version (ubuntu-latest Oct 2026 se badal raha hai)
    timeout-minutes: 200           # banana + post ke time tak rukna

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Aaj ka kaam (job) tay karo
        id: job
        run: |
          JOB="${{ github.event.inputs.job }}"
          if [ -z "$JOB" ]; then
            case "${{ github.event.schedule }}" in
              "13 1 * * *")  JOB=am ;;
              "13 14 * * *") JOB=pm ;;
              *)            JOB=series ;;
            esac
          fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "Aaj ka kaam: $JOB"

      - name: Instagram jaanch (kuch post nahi hota)
        if: steps.job.outputs.job == 'check'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          pip install requests >/dev/null
          python ig_post.py check | tee generated_reels/ig_check.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add generated_reels/ig_check.txt
          git diff --staged --quiet || git commit -m "Instagram check [skip ci]"
          git pull --rebase origin main || true
          git push origin main || git push

      - name: Set up Python
        if: steps.job.outputs.job != 'check'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        if: steps.job.outputs.job != 'check'
        timeout-minutes: 20
        run: |
          for i in 1 2 3; do
            timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && \
            timeout 420 sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
              ffmpeg fonts-dejavu-core fonts-liberation libraqm0 poppler-utils && break
            echo "apt koshish $i fail - dobara"; sleep 20
          done
          which ffmpeg pdftotext

      - name: Install Python Packages
        if: steps.job.outputs.job != 'check'
        run: |
          python -m pip install --upgrade pip
          pip install requests pypdf pillow numpy edge-tts

      - name: Series reel (shaam 5 baje wali)
        if: steps.job.outputs.job == 'series'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python main.py

      - name: Saathi PYQ reel (series ke saath - fail ho to bhi series nahi rukti)
        if: always() && steps.job.outputs.job == 'series'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python pyq_reel.py

      - name: 8 AM - 7 PYQ quiz reel
        if: steps.job.outputs.job == 'am'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python pyq_daily.py am

      - name: 9 PM - 7 PYQ copy-panna reel + carousel
        if: steps.job.outputs.job == 'pm'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python pyq_daily.py pm

      - name: Save and Commit Generated Reels & Progress
        if: always() && steps.job.outputs.job != 'check'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p generated_reels clause_plans
          git add progress_state.json generated_reels/ clause_plans/ pyq_papers/pyq_bank.json
          git diff --staged --quiet || git commit -m "Add generated reels and update progress state [skip ci]"
          git pull --rebase origin main || echo "Rebase not needed"
          git push origin main || git push

      - name: Post ke time tak ruko (8 AM / 5 PM / 9 PM IST)
        if: always() && github.event_name == 'schedule'
        run: |
          case "${{ steps.job.outputs.job }}" in
            am) T="08:00" ;; series) T="17:00" ;; pm) T="21:00" ;;
          esac
          NOW=$(TZ=Asia/Kolkata date +%s)
          TGT=$(TZ=Asia/Kolkata date -d "today $T" +%s)
          W=$((TGT-NOW))
          if [ $W -gt 0 ] && [ $W -lt 9000 ]; then echo "$W sec ruk rahe hain ($T IST)"; sleep $W; else echo "turant post"; fi

      - name: Instagram pe post (title + description + hashtag + cover)
        if: always() && steps.job.outputs.job != 'check'
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python ig_post.py ${{ steps.job.outputs.job }}

      - name: Post ka hisaab save karo
        if: always() && steps.job.outputs.job != 'check'
        run: |
          git add generated_reels/ig_posted.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Instagram post log [skip ci]"
          git pull --rebase origin main || true
          git push origin main || git push
