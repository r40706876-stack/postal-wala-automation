name: Demo - v24 sawal pehle (ek baar)

on:
  workflow_dispatch:

concurrency:
  group: postal-wala-reel
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-liberation libraqm0 poppler-utils
      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pypdf pillow numpy edge-tts
      - name: Demo reel banao (asli awaaz ke saath, kuch post nahi hota)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python demo_v24.py
      - name: Demo repo me save karo
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add demo_out/bharosa_v24/
          git diff --staged --quiet || git commit -m "Demo: v24 sawal pehle (Clause 26 Part 5) [skip ci]"
          git pull --rebase origin main || true
          git push origin main || git push
