name: Demo - v24 sawal pehle + galti drama + Blender 3D (ek baar)

on:
  workflow_dispatch:

concurrency:
  group: postal-wala-reel
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-liberation libraqm0 poppler-utils
      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pypdf pillow numpy edge-tts
      - name: Golu ke naye bhaav (Cloudflare FLUX.2, ek baar - bane hon to chhod deta hai)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -c "import main; main.ensure_grahak_expressions()"
      - name: Blender 4.2 (animation-special jaisa) - fail ho to demo bina 3D ke
        id: blender
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender"
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 25 -o "$RUNNER_TEMP/blender.tar.xz" \
            "https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 xvfb libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6
          "$RUNNER_TEMP/blender/blender" --version | head -n 2
          echo "BL=$RUNNER_TEMP/blender/blender" >> "$GITHUB_ENV"
      - name: Blender 3D shot render (lifaafa + globe + ✓)
        id: b3d
        if: steps.blender.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 45
        run: |
          set -euo pipefail
          python b3d_texture.py /tmp/lifaafa_tex.png "To," "Mr. John Smith" "123, Main Road" "London, UK"
          B3D_TEX=/tmp/lifaafa_tex.png B3D_OUT=/tmp/b3d/ B3D_SEC=3.6 xvfb-run -a "$BL" -b -t 2 --python b3d_lifaafa.py 2>&1 | tail -n 40
          ls /tmp/b3d | head -3; ls /tmp/b3d | wc -l
          mkdir -p demo_out/bharosa_v24
          ffmpeg -y -v error -framerate 24 -i /tmp/b3d/f_%04d.png -c:v libx264 -pix_fmt yuv420p demo_out/bharosa_v24/b3d_shot_part5.mp4
          echo "B3D_ANS=/tmp/b3d" >> "$GITHUB_ENV"
      - name: Demo reel banao (asli awaaz ke saath, kuch post nahi hota)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python demo_v24.py
      - name: Demo repo me save karo
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add demo_out/bharosa_v24/ clause_plans/characters/
          git diff --staged --quiet || git commit -m "Demo: v24 sawal pehle (Clause 26 Part 5) [skip ci]"
          git pull --rebase origin main || true
          git push origin main || git push
