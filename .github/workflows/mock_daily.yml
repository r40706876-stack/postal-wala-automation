name: Daily mock sawal reel

# Roz: timer.yml 15:28 IST pe chalata hai (demo khaali, post=true) -> reel bane -> 4:30 PM IST pe Instagram post.
# Haath se demo: demo me 'part:naam:lang' likho.
on:
  workflow_dispatch:
    inputs:
      demo:
        description: "Khaas sawal id (khaali = apne aap chuno)"
        default: ""
      post:
        description: "Instagram pe post kare? (sirf daily reel)"
        type: boolean
        default: false
      only_post:
        description: "Nayi reel mat banao - aaj ki bani hui reel hi post karo"
        type: boolean
        default: false
      post_time:
        description: "Post ka samay IST (khaali = 16:30)"
        default: ""

permissions:
  contents: write

concurrency:
  group: mock-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-noto-color-emoji fonts-freefont-ttf >/dev/null
          pip install playwright==1.47.0 numpy requests pypdf pillow edge-tts faster-whisper >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
      - name: Reel banao
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_TTS_MODEL: gemini-3.8-flash-tts
          GEMINI_TTS_VOICE: hi-in-training-1
          GEMINI_TTS_STYLE: "lively elder-brother teacher: warm, clear and expressive with natural ups and downs - curious on questions, firm and serious on warnings, happy on answers, calm on examples; small natural pauses"
        if: ${{ !inputs.only_post }}
        run: |
          if [ -n "${{ inputs.demo }}" ]; then python mock_reel.py build --id "${{ inputs.demo }}"; else python mock_reel.py build; fi
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mock_reels
          git diff --cached --quiet || git commit -m "Mock reel [skip ci]"
          git pull --rebase -q origin main && git push
      - name: Post ke samay tak ruko
        id: wait
        if: inputs.post && inputs.demo == ''
        run: |
          TGT=$(TZ=Asia/Kolkata date -d "today ${{ inputs.post_time || vars.MOCK_TIME || '16:30' }}" +%s); NOW=$(date +%s); W=$((TGT-NOW))
          if [ $W -gt 0 ] && [ $W -lt 9000 ]; then echo "$W sec ruk rahe"; sleep $W; fi
          LATE=$(( $(date +%s) - TGT ))
          if [ $LATE -gt 3600 ]; then echo "post=no" >> "$GITHUB_OUTPUT"; echo "Mock slot nikal gaya - post nahi (reel repo me hai)"; else echo "post=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Instagram post
        if: inputs.post && inputs.demo == '' && steps.wait.outputs.post == 'yes'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_REPO: ${{ github.repository }}
          MEDIA_TOKEN: ${{ github.token }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          case "$(TZ=Asia/Kolkata date +%F)" in 2026-11-17|2026-11-19) true;; *) false;; esac && { echo 'User: aaj mock post nahi'; exit 0; }; if false; then echo 'User requested manual upload today; automatic post skipped'; exit 0; fi
          python mock_reel.py post
          git add generated_reels/ig_posted.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Instagram post log [skip ci]"
          git pull --rebase -q origin main && git push
