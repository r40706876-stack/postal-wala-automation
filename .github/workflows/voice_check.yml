name: Voice Check (sirf test)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Kis branch ka code test karna hai"
        default: "voice-v20.3"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests pypdf pillow numpy edge-tts
      - name: Voice check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python voice_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-check
          path: voice_check_out/
