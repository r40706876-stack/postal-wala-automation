name: Comments ka jawab (har 2 ghante)

# v34 (2026-11-09): pichhle 2 din ki reels ke naye comments par chhota jawab (sahi/galat option, MOCK, sawal).
# Token me instagram_business_manage_comments na ho -> sirf log me "ijaazat nahi", kuch nahi tootta.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1-17/2 * * *'          # ~6:47 AM se 11:47 PM IST tak har 2 ghante

concurrency:
  group: postal-wala-comments
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Jawab do
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_REPO: ${{ github.repository }}
          MEDIA_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python ig_comments.py reply
      - name: Save
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add generated_reels/ig_replied.json generated_reels/viewer_questions.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Comments ke jawab [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep 10; done
