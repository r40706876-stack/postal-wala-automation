name: Instagram insights (sirf padhna)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Insights nikaalo
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_REPO: ${{ github.repository }}
          MEDIA_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python ig_insights.py
      - name: Save
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add generated_reels/ig_insights.json
          git diff --staged --quiet || git commit -m "Instagram insights [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep 10; done
