name: Notes franking bhaag 2 (19 Nov, post nahi - pehle user dekhe)
on:
  push:
    paths: ['.github/workflows/notes_franking2_20261119.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: notes-reel
  cancel-in-progress: false
jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-freefont-ttf >/dev/null
          pip install playwright==1.47.0 numpy requests pypdf pillow edge-tts >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
      - name: Demo - kal ka topic (table) + franking jawab
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_TTS_KEYS: ${{ secrets.GEMINI_API_KEY_2 }},${{ secrets.GEMINI_API_KEY_3 }},${{ secrets.GEMINI_API_KEY_4 }}
          NOTES_GEMINI_ONLY: "1"
        run: |
          NOTES_CUSTOM=notes_reels/custom_franking_2.json python notes_reel.py build --demo "01:ज़रूरी बातें:hi"
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes_reels
          git diff --cached --quiet || git commit -m "Notes reel demo (jeetne wala format) [skip ci]"
          git pull --rebase -q origin main && git push
