name: Render the full-frame mock reel
on:
  push:
    branches: [preview/mock-motion-20261120]
    paths: [.github/workflows/mock_motion_preview_20261120.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: postal-edge-mock-motion-preview
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          ref: b1ab5d962def079084fe5c702566ed80a62cf1a7
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /brand_config.json
            /deep/
            /mock_tpl/
            /mock_tpl30/
            /rebrand_reels/promo_v2/img/q.jpg
            /rebrand_reels/promo_v2/img/ans.jpg
            /rebrand_reels/promo_v2/img/wrong.jpg
            /mock_reels/2026-11-19_p_d1a16a3cf2.html
            /mock_reels/2026-11-19_p_d1a16a3cf2_script.json
            /mock_reels/2026-11-19_p_d1a16a3cf2_cover.jpg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare Chromium, fonts and video tools
        timeout-minutes: 6
        run: |
          python -m pip install -q --retries 1 --timeout 20 requests pypdf pillow numpy edge-tts playwright==1.47.0 imageio-ffmpeg
          python -m playwright install chromium
          mkdir -p "$RUNNER_TEMP/bin" "$HOME/.local/share/fonts"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/bin/ffmpeg"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          curl -fsSL --max-time 20 'https://raw.githubusercontent.com/google/fonts/main/ofl/baloo2/Baloo2%5Bwght%5D.ttf' -o "$HOME/.local/share/fonts/Baloo2.ttf"
          curl -fsSL --max-time 20 'https://raw.githubusercontent.com/google/fonts/main/ofl/hind/Hind-Bold.ttf' -o "$HOME/.local/share/fonts/Hind-Bold.ttf"
          fc-cache -f
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44667067905
          name: Postal-Edge-Mock-Animated-25-PYQ
          path: confirmed
      - name: Build the updated scene layout
        run: |
          mkdir -p out
          python -u - <<'PY'
          from pathlib import Path
          import json, re
          from mock_reel import page30
          archive = Path("mock_reels/2026-11-19_p_d1a16a3cf2.html").read_text(encoding="utf-8")
          question = json.loads(re.search(r"window\.SPEC = (.+);", archive).group(1))
          script = json.loads(Path("mock_reels/2026-11-19_p_d1a16a3cf2_script.json").read_text(encoding="utf-8"))
          Path("out/mock.html").write_text(page30(question, script, with_motion=True), encoding="utf-8")
          PY
          cp confirmed/cover.jpg out/cover.jpg
          cp confirmed/Postal_Edge_Mock_Animated_25_PYQ.mp4.cues.json out/cues.json
      - name: Check actor visibility, content clearance and demo timing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from deep.render_deep import open_page

          cues = json.loads(Path("out/cues.json").read_text())
          with sync_playwright() as browser_api:
              browser, page = open_page(browser_api, "out/mock.html", cues)
              result = page.evaluate("""() => {
                const panel = document.querySelector('#pan');
                const paper = document.querySelector('#paper');
                const caption = document.querySelector('#cap');
                const actors = [...document.querySelectorAll('.peActor')];
                const demo = document.querySelector('#peIntro');
                const label = document.querySelector('#demoResultLabel');
                const phases = new Set();
                let noActors = 0, soloSpeech = 0, pairSpeech = 0, failures = [];
                const hits = (a,b) => a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
                const visible = el => {
                    for (let node=el; node && node.id!=="root"; node=node.parentElement) {
                        const style=getComputedStyle(node);
                        if (node.hidden || style.display==="none" || Number(style.opacity)<.08) return false;
                    }
                    return true;
                };
                const contents = [...document.querySelectorAll("#vZ .tag, #vZ .lbl, #vZ .gi, #vZ .ga, #vZ .e, #vZ .trk, #vZ .pig, #vZ .road, #zT, #stn, #bigT, #vA .tag, #aB, #aT, #vA .cf")];
                for (let i=0; i<window.TOTAL*30; i++) {
                    const t=i/30;
                    window.seek(t);
                    const board = panel.getBoundingClientRect(), root = document.querySelector("#root").getBoundingClientRect();
                    if (getComputedStyle(panel).transform !== "none" || Math.abs(board.width-508)>.15 || Math.abs(board.left-root.left-16)>.15) failures.push([t,"panel resized"]);
                    const appearing = actors.filter(actor => !actor.hidden);
                    if (demo.style.display === "block") {
                        phases.add(label.dataset.phase);
                        if (appearing.length) failures.push([t,"actor covers demo"]);
                    }
                    if (!appearing.length) noActors++;
                    if (appearing.length === 2) {
                        if (!appearing.every(actor => actor.dataset.gaze === "partner")) failures.push([t,"partner gaze"]);
                        if (appearing[0].dataset.mouth !== "0") failures.push([t,"listener speaking"]);
                        if (appearing[1].dataset.mouth !== "0") pairSpeech++;
                        if (hits(appearing[0].getBoundingClientRect(),appearing[1].getBoundingClientRect())) failures.push([t,"actor overlap"]);
                    } else if (appearing.length === 1) {
                        if (appearing[0].dataset.gaze !== "audience") failures.push([t,"audience gaze"]);
                        if (appearing[0].dataset.mouth !== "0") soloSpeech++;
                    }
                    if (!appearing.length) continue;
                    const occupied = [paper,caption,...contents].filter(visible).map(el => el.getBoundingClientRect());
                    for (const actor of appearing) {
                        const rect=actor.getBoundingClientRect();
                        if (occupied.some(box => hits(rect,box))) failures.push([t,"text or picture overlap"]);
                        if (rect.left<board.left || rect.right>board.right || rect.top<board.top || rect.bottom>board.bottom) failures.push([t,"actor outside original panel"]);
                    }
                }
                return {phases:[...phases],noActors,soloSpeech,pairSpeech,failures:failures.slice(0,15)};
              }""")
              print(result)
              assert not result["failures"], result
              assert result["phases"] == ["question", "correct", "wrong"], result
              assert result["noActors"] > 450 and result["soloSpeech"] > 20 and result["pairSpeech"] > 5, result
              browser.close()
          PY
      - name: Render revised visuals with the same original audio
        run: |
          old=confirmed/Postal_Edge_Mock_Animated_25_PYQ.mp4
          video=out/Postal_Edge_Mock_Animated_25_PYQ_V3.mp4
          test "$(sha256sum "$old" | cut -d' ' -f1)" = df23adf328bca62fb8a0f6c75a2920e724bc048bb66e5fd9db387a7db4daeec2
          python -u deep/render_deep.py out/mock.html out/picture.mp4 out/cues.json
          ffmpeg -y -v error -i out/picture.mp4 -i "$old" -map 0:v:0 -map 1:a:0 -c copy -movflags +faststart "$video"
          test "$(ffmpeg -v error -i "$old" -map 0:a:0 -c copy -f hash -)" = "$(ffmpeg -v error -i "$video" -map 0:a:0 -c copy -f hash -)"
          ffmpeg -v error -xerror -i "$video" -map 0:v:0 -map 0:a:0 -f null -
          ffmpeg -y -v error -i "$video" -vf 'fps=1/2.5,scale=216:384,tile=5x3' -frames:v 1 out/contact.jpg
          sha256sum "$video"
      - name: Save verified MP4 for direct GitHub download
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp out/Postal_Edge_Mock_Animated_25_PYQ_V3.mp4 mock_reels/
          git add --sparse -f mock_reels/Postal_Edge_Mock_Animated_25_PYQ_V3.mp4
          git commit -m 'Save full-frame mock reel with optional character appearances [skip ci]'
          git push origin HEAD:refs/heads/preview/mock-motion-20261120
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Postal-Edge-Mock-Animated-25-PYQ-V3
          path: |
            out/Postal_Edge_Mock_Animated_25_PYQ_V3.mp4
            out/contact.jpg
            out/cover.jpg
          if-no-files-found: error
