name: Demo - 3D kirdaar (Bhaiya + Golu) + saamaan

# v26 (2026-10-29): Blender me Bhaiya/Golu ke 3D model, saare bhaav, saamaan, chalti jhalak + rang-birange text.
# Kuch post nahi hota. Nateeja: demo_out/b3d_chars/
on:
  workflow_dispatch:

concurrency:
  group: postal-wala-b3d-chars
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        mode: [sheet, props, motion]
    steps:
      - uses: actions/checkout@v4
      - name: Blender 4.2
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender"
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 25 -o "$RUNNER_TEMP/blender.tar.xz" \
            "https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 xvfb libxi6 libxxf86vm1 \
            libxfixes3 libxrender1 libxkbcommon0 libsm6
      - name: Render (${{ matrix.mode }})
        timeout-minutes: 55
        run: |
          set -o pipefail
          B3D_MODE=${{ matrix.mode }} B3D_OUT="$PWD/b3d_out/${{ matrix.mode }}" xvfb-run -a \
            "$RUNNER_TEMP/blender/blender" -b -t 2 --python b3d_charsheet.py 2>&1 \
            | grep -E "B3D_|Error|error|Traceback|CEL_|OUTLINE_|CHECKER_|Fra:|Saved" | grep -v "^Fra:.*Sample" | tail -n 80
          ls b3d_out/${{ matrix.mode }} | wc -l
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b3d-chars-${{ matrix.mode }}
          path: b3d_out/
          if-no-files-found: ignore
          retention-days: 3

  finish:
    needs: render
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libraqm0
          pip install pillow numpy requests
          curl -fsSL -o Mukta-ExtraBold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/mukta/Mukta-ExtraBold.ttf || true
      - uses: actions/download-artifact@v4
        with:
          pattern: b3d-chars-*
          path: b3d_out
          merge-multiple: true
      - name: Jodo
        run: |
          ls -R b3d_out | head -20
          B3D_SRC=b3d_out python b3d_chars_finish.py
      - name: Repo me save
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add demo_out/b3d_chars/
          git diff --staged --quiet || git commit -m "Demo: 3D kirdaar + saamaan [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep 10; done
