name: Website Cloudflare Pages par (postalwala.pages.dev)

# Website ka source (docs/) ab private core repo me hai. Ye workflow har ghante core ka docs/ dekhta hai:
# docs/ badla ho (naya tree hash) tabhi deploy karta hai, warna 10-15 sec me khatam.
# Haath se turant deploy: Actions -> is workflow -> Run (force = true).
# ANALYTICS_VIEWER_EMAILS optional: comma-separated Google emails. Run with force after changing it.
# Secrets: CLOUDFLARE_PAGES_TOKEN / CLOUDFLARE_API_TOKEN(_2/_3) + CLOUDFLARE_ACCOUNT_ID(_2/_3), CORE_TOKEN
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages_deploy.yml']
  workflow_dispatch:
    inputs:
      project:
        description: "pages.dev naam"
        default: "postalwala"
      force:
        description: "docs na badla ho to bhi deploy karo"
        type: boolean
        default: false
  schedule:
    - cron: '41 * * * *'

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      T0: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
      A0: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      T1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      A1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      T2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
      A2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_2 }}
      T3: ${{ secrets.CLOUDFLARE_API_TOKEN_3 }}
      A3: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_3 }}
      PROJECT: ${{ inputs.project || 'postalwala' }}
      # 2026-11-18: Postak login + payment (repo Settings > Secrets me daalo; na ho to login/payment band, site chalti rahe)
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      RZP_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RZP_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      RZP_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
      OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
      ANALYTICS_VIEWER_EMAILS: ${{ secrets.ANALYTICS_VIEWER_EMAILS }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          ref: main
          token: ${{ secrets.CORE_TOKEN }}
          fetch-depth: 1
          sparse-checkout: |
            docs
            functions
            stats_key.txt
            content_key.txt
      - name: docs badla?
        id: h
        run: echo "hash=$(git rev-parse HEAD:docs)-$(git rev-parse HEAD:functions 2>/dev/null | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Pichla deploy (cache)
        id: c
        if: ${{ github.event_name != 'push' && !inputs.force }}
        uses: actions/cache/restore@v4
        with:
          path: .deployed
          key: pages-docs-${{ steps.h.outputs.hash }}
      - uses: actions/setup-node@v4
        if: steps.c.outputs.cache-hit != 'true'
        with:
          node-version: "20"
      - name: Deploy (jis token me Pages ki ijazat ho)
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          for k in 0 1 2 3; do
            T=$(eval echo \$T$k); A=$(eval echo \$A$k)
            [ -z "$T" ] || [ -z "$A" ] && { echo "token $k: nahi hai"; continue; }
            export CLOUDFLARE_API_TOKEN="$T" CLOUDFLARE_ACCOUNT_ID="$A"
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main >/tmp/c.log 2>&1 || true
            grep -iE "Successfully|already exists|error|Authentication" /tmp/c.log | head -3 | sed "s/^/token $k create: /"
            # 2026-11-15: ginti (visit / mock shuru / jama) ke liye D1 database - na bane to site bina ginti ke deploy
            rm -f wrangler.toml
            if [ -d functions ]; then
              DBN=postalwala-stats
              dbid() { npx --yes wrangler@4 d1 list --json 2>/dev/null | python3 -c "import json,sys
          try: d=json.load(sys.stdin)
          except Exception: d=[]
          print(next((x.get('uuid','') for x in d if x.get('name')=='$DBN'),''))"; }
              ID=$(dbid); [ -z "$ID" ] && { npx --yes wrangler@4 d1 create $DBN >/tmp/d1.log 2>&1 || grep -iE "error|permission|auth" /tmp/d1.log | head -2 | sed "s/^/token $k d1: /"; ID=$(dbid); }
              KEY=$(tr -d ' \n' < stats_key.txt 2>/dev/null)
              if [ -n "$ID" ]; then
                printf 'name = "%s"\npages_build_output_dir = "docs"\ncompatibility_date = "2024-09-01"\n\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "%s"\ndatabase_id = "%s"\n\n[vars]\nSTATS_KEY = "%s"\nGOOGLE_CLIENT_ID = "%s"\nRZP_KEY_ID = "%s"\nOWNER_EMAILS = "%s"\nANALYTICS_VIEWER_EMAILS = %s\n' "$PROJECT" "$DBN" "$ID" "$KEY" "$GOOGLE_CLIENT_ID" "$RZP_KEY_ID" "$OWNER_EMAILS" "$(python3 -c 'import json, os; print(json.dumps(os.environ.get("ANALYTICS_VIEWER_EMAILS", ""), ensure_ascii=False))')" > wrangler.toml
                npx --yes wrangler@4 d1 execute $DBN --remote --file functions/schema.sql >/tmp/sq.log 2>&1 && echo "token $k: ginti DB taiyaar" || grep -iE "error" /tmp/sq.log | head -2
              else echo "token $k: D1 ki ijazat nahi - ginti band rahegi"; fi
            fi
            if [ -n "$ANALYTICS_VIEWER_EMAILS" ] && [ ! -f wrangler.toml ]; then
              echo "token $k: skipping deploy because Analytics Viewer needs the D1 binding"
              continue
            fi
            export CONTENT_KEY=$(tr -d ' \n' < content_key.txt 2>/dev/null)
            for sn in RZP_KEY_SECRET RZP_WEBHOOK_SECRET CONTENT_KEY; do v=$(eval echo \$$sn); [ -n "$v" ] && { printf '%s' "$v" | npx --yes wrangler@4 pages secret put $sn --project-name "$PROJECT" >/tmp/sec.log 2>&1 && echo "token $k: $sn rakha" || grep -iE "error" /tmp/sec.log | head -1; }; done
            if npx --yes wrangler@4 pages deploy docs --project-name "$PROJECT" --branch main --commit-dirty=true >/tmp/d.log 2>&1; then
              if [ -n "$ANALYTICS_VIEWER_EMAILS" ]; then echo "Analytics Viewer configuration included"; fi
              echo "DEPLOY_OK token $k"; grep -oE "https://[a-z0-9.-]+pages\.dev" /tmp/d.log | sort -u
              echo "${{ steps.h.outputs.hash }}" > .deployed; exit 0
            fi
            grep -iE "error|Authentication|permission" /tmp/d.log | head -3 | sed "s/^/token $k deploy: /"
          done
          echo "Kisi token me Pages ki ijazat nahi"; exit 1
      - name: Deploy yaad rakho
        if: steps.c.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .deployed
          key: pages-docs-${{ steps.h.outputs.hash }}
