name: Demo - Bharosa Reel (ek baar)

on:
  workflow_dispatch:

concurrency:
  group: postal-wala-reel
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation libraqm0 poppler-utils
      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pypdf pillow numpy edge-tts
      - name: Demo reel banao (asli awaaz ke saath)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python demo_bharosa.py
      - name: Demo repo me save karo
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add demo_out/bharosa/
          git diff --staged --quiet || git commit -m "Demo: bharosa reel (Clause 26 Part 6) [skip ci]"
          git pull --rebase origin main || true
          git push origin main || git push
