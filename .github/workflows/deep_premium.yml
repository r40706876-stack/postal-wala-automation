name: Deep class PREMIUM (Claude script + premium animation)

# 2026-11-18: Clause 1-5 demo videos. Script Claude ne khud likhi (deep/premium/cN.json, core repo),
# animation = naya premium engine (deep/premium/core.js + cN.js). Awaaz = wahi Postal Wala Gemini awaaz (ek baar me).
# Chalane ke 2 tareeke: (1) Actions -> Run workflow -> clause number, (2) premium_trigger.txt me clause number likh kar commit.
# Post nahi hoti - video core repo ke demo_out/deep/clauseN_premium.mp4 me.
on:
  workflow_dispatch:
    inputs:
      clause:
        description: "Clause number"
        default: "1"
      take:
        description: "pehle bani awaaz (wav path) dobara - khaali = nayi Gemini awaaz"
        default: ""
  push:
    branches: [main]
    paths: ["premium_trigger.txt"]

permissions:
  contents: read

concurrency:
  group: deep-premium
  cancel-in-progress: false

jobs:
  premium:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          path: pub
      - name: Clause number
        id: n
        run: |
          N="${{ inputs.clause }}"
          if [ -z "$N" ]; then N=$(tr -dc '0-9' < pub/premium_trigger.txt | head -c 3); fi
          echo "n=${N:-1}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core libraqm0 poppler-utils
          pip install requests pypdf pillow numpy edge-tts playwright==1.47.0 faster-whisper
          python -m playwright install --with-deps chromium
      - name: Build (Claude script -> premium HTML)
        working-directory: core
        run: python deep/premium/build.py ${{ steps.n.outputs.n }}
      - name: Banao (awaaz + animation + sound)
        working-directory: core
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_DEEP_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: gemini-3.8-flash-tts
          GEMINI_TTS_VOICE: hi-in-training-1
          DEEP_TAKE: ${{ inputs.take }}
          DEEP_TAKE_SAVE: demo_out/deep/take_premium_c${{ steps.n.outputs.n }}.wav
          DEEP_VOICE_CACHE: demo_out/deep/vcache_c${{ steps.n.outputs.n }}
        run: |
          mkdir -p demo_out/deep
          T=demo_out/deep/take_premium_c${{ steps.n.outputs.n }}.wav
          if [ -z "$DEEP_TAKE" ] && [ -f "$T" ]; then export DEEP_TAKE="$T"; echo "pehle wali awaaz dobara: $T (Gemini bachat)"; fi
          python deep/deep_demo.py deep/premium_c${{ steps.n.outputs.n }}.html demo_out/deep/clause${{ steps.n.outputs.n }}_premium.mp4
      - name: Save (core repo)
        if: always()
        working-directory: core
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add demo_out/deep/clause*_premium.mp4* demo_out/deep/take_premium_c*.wav || true
          git diff --staged --quiet || git commit -m "Premium deep class clause ${{ steps.n.outputs.n }} [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep 10; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clause${{ steps.n.outputs.n }}_premium
          path: core/demo_out/deep/clause${{ steps.n.outputs.n }}_premium.mp4
          if-no-files-found: ignore
