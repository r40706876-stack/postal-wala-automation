name: Holiday full screenshot and memory groups
on:
  push:
    paths: ['.github/workflows/notes_presentation_review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core >/dev/null
          pip install -q playwright==1.47.0 numpy requests pypdf pillow edge-tts
          python -m playwright install --with-deps chromium >/dev/null
      - name: Render complete list then memory groups
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_KEYS: ${{ secrets.GEMINI_API_KEY_2 }},${{ secrets.GEMINI_API_KEY_3 }},${{ secrets.GEMINI_API_KEY_4 }}
          PYTHONUNBUFFERED: '1'
          NOTES_GEMINI_ONLY: '1'
          NOTES_REUSE_PREVIEW: '1'
        run: python3 ops/screenshot_holidays.py
      - name: Save corrected preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes_reels/demo_01-11_hi* notes_reels/presentation_review.json notes_reels/holiday_qa*
          git diff --cached --quiet || git commit -m 'Full screenshot holiday list first, memory groups second [skip ci]'
          git pull --rebase -q origin main && git push
      - uses: actions/upload-artifact@v4
        with:
          name: Holiday-screenshot-and-groups
          path: |
            notes_reels/demo_01-11_hi*
            notes_reels/presentation_review.json
            notes_reels/holiday_qa*
