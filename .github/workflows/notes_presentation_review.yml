name: Edit original holiday video - add holiday names
on:
  push:
    paths: ['.github/workflows/notes_presentation_review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
      - name: Install video editor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null
      - name: Keep original opening and replace repeated explanation only
        run: python3 ops/hybrid_holiday_edit.py
      - name: Save corrected original preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes_reels/demo_01-11_hi* notes_reels/presentation_review.json
          git diff --cached --quiet || git commit -m 'Original holiday video with actual holiday names replacing repeated breakdown [skip ci]'
          git pull --rebase -q origin main && git push
      - uses: actions/upload-artifact@v4
        with:
          name: Original-video-with-holiday-list
          path: |
            notes_reels/demo_01-11_hi*
            notes_reels/presentation_review.json
