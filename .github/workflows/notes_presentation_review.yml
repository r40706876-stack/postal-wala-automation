name: Holiday doubt - comparison trap and trick preview
on:
  push:
    paths: ['.github/workflows/notes_presentation_review.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: notes-presentation-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-freefont-ttf >/dev/null
          pip install playwright==1.47.0 numpy requests pypdf pillow edge-tts >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
      - name: Render structured holiday lesson with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NOTES_GEMINI_ONLY: '1'
          NOTES_JOIN: '0'
          NOTES_REUSE_PREVIEW: '1'
          NOTES_LAYOUT_QA: '1'
          NOTES_TRIM_LINES: '0'
        run: |
          python notes_reel.py build --demo '01:डाकघर अवकाश:hi'
          python - <<'PY'
          import json
          d=json.load(open('notes_reels/presentation_review.json'))
          assert len(d['points']) == 2, d
          assert d['editorial_plan'] == 'holidays_2026'
          assert len(d['sources']) == 2
          assert d['script']['trap'] and d['script']['trick']
          assert [x['k'] for x in d['timeline']] == ['hook','line0','line1','trap','trick','surprise','cta']
          assert d['voice'] == ['gemini'], d['voice']
          assert d['duration'] <= 40, d['duration']
          gift = next(x for x in d['timeline'] if x['k'] == 'surprise')
          assert 2 <= gift['d'] <= 3, gift
          assert len(d['script']['written_explanations']) == 2
          assert 'बायो' not in d['script']['cta']
          assert 'कमेंट' in d['script']['cta']
          assert 'फॉलो' in d['script']['cta'] and 'मॉक' in d['script']['cta']
          PY
      - name: Save preview for review
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes_reels/demo_01-11_hi* notes_reels/presentation_review.json
          git diff --cached --quiet || git commit -m 'Holiday comparison-trap-trick preview for user review [skip ci]'
          git pull --rebase -q origin main && git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Holiday-comparison-preview
          path: |
            notes_reels/demo_01-11_hi*
            notes_reels/presentation_review.json
          if-no-files-found: error
