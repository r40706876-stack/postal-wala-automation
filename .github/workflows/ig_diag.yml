name: IG upload jaanch (post nahi karta)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          pip install -q requests
          ffprobe -v error -show_entries format=duration,size -of compact mock_reels/2026-11-15_p_cfd754505b.mp4 notes_reels/notes_2026-11-15_01-07_hi.mp4
          python - <<'P'
          import os, requests, time
          T=os.environ["IG_ACCESS_TOKEN"]; U=os.environ["IG_USER_ID"]; G="https://graph.facebook.com/v19.0/"
          for v in ["mock_reels/2026-11-15_p_cfd754505b.mp4", "notes_reels/notes_2026-11-15_01-07_hi.mp4"]:
              r = requests.post(f"{G}{U}/media", data={"media_type":"REELS","upload_type":"resumable","caption":"test","access_token":T}).json()
              print("\n==", v, "container:", r)
              cid = r.get("id"); time.sleep(5)
              data = open(v,"rb").read()
              up = requests.post(r.get("uri") or f"https://rupload.facebook.com/ig-api-upload/v19.0/{cid}",
                  headers={"Authorization": f"OAuth {T}", "offset":"0", "file_size":str(len(data)), "Content-Type":"application/octet-stream"}, data=data, timeout=600)
              print("upload:", up.status_code, up.text[:1500])
              time.sleep(20)
              print("status:", requests.get(f"{G}{cid}", params={"fields":"status_code,status","access_token":T}).json())
          print("\nlimit:", requests.get(f"{G}{U}/content_publishing_limit", params={"fields":"quota_usage,config","access_token":T}).json())
          P
