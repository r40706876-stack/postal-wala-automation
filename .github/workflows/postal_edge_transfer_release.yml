name: Release approved Postal Edge transfer reel on 21 November
on:
  schedule:
    - cron: '32 12 21 11 *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/postal_edge_transfer_release.yml
      - postal_release/start_20261121.txt
      - postal_release/transfer_publish.py
permissions:
  actions: read
  contents: write
concurrency:
  group: postal-doubts-instagram-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Resolve verify or publish mode
        id: slot
        run: |
          if [ "$(TZ=Asia/Kolkata date +%F)" = "2026-11-21" ]; then
            echo mode=publish >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo mode=verify >> "$GITHUB_OUTPUT"
          else
            echo mode=skip >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.slot.outputs.mode != 'skip'
        with:
          path: production
          sparse-checkout: postal_release
      - uses: actions/checkout@v4
        if: steps.slot.outputs.mode != 'skip'
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          path: core
          sparse-checkout: |
            /ig_post.py
            /branding.py
            /brand_config.json
            /generated_reels/ig_posted.json
            /doubts_reels/transfer_demo_20261121_receipt.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        if: steps.slot.outputs.mode != 'skip'
        with:
          github-token: ${{ github.token }}
          run-id: 44594468241
          name: postal-edge-rule3-transfer-website-demo
          path: source
      - uses: actions/setup-python@v5
        if: steps.slot.outputs.mode != 'skip'
        with:
          python-version: '3.11'
      - if: steps.slot.outputs.mode != 'skip'
        run: |
          python -m pip install -q requests pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -v error -y -ss 1.8 -i source/Postal_Edge_Rule3_Transfer_Website_Demo.mp4 -frames:v 1 -q:v 2 source/Postal_Edge_Rule3_Transfer_Cover.jpg
      - name: Verify or publish the approved reel
        if: steps.slot.outputs.mode != 'skip'
        working-directory: core
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_REPO: ${{ github.repository }}
          MEDIA_TOKEN: ${{ github.token }}
          FB_POST: '0'
          RELEASE_MODE: ${{ steps.slot.outputs.mode }}
        run: |
          python -u ../production/postal_release/transfer_publish.py \
            ../source/Postal_Edge_Rule3_Transfer_Website_Demo.mp4 \
            ../source/Postal_Edge_Rule3_Transfer_Cover.jpg "$RELEASE_MODE"
      - name: Save publication receipt
        if: always() && steps.slot.outputs.mode == 'publish'
        working-directory: core
        run: |
          receipt=doubts_reels/transfer_demo_20261121_receipt.json
          [ -f "$receipt" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$receipt" generated_reels/ig_posted.json
          git diff --cached --quiet && exit 0
          git commit -m "Record Postal Edge transfer demo Instagram publication [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 4
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always() && steps.slot.outputs.mode == 'publish'
        with:
          name: postal-edge-transfer-release-receipt
          path: core/doubts_reels/transfer_demo_20261121_receipt.json
          if-no-files-found: ignore
