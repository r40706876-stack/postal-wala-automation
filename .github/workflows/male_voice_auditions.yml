name: Postal Edge Hindi male voice auditions
on:
  workflow_dispatch:
    inputs:
      seed_run:
        description: Actions run ID with earlier audition MP3s
        type: string
        default: '44508376732'
  push:
    branches: [main]
    paths:
      - '.github/workflows/male_voice_auditions.yml'
permissions:
  actions: read
  contents: read
concurrency:
  group: postal-male-voice-auditions
  cancel-in-progress: false
jobs:
  audition:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          sparse-checkout: tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: postal-edge-hindi-male-voice-demos
          run-id: ${{ inputs.seed_run || 44508376732 }}
          github-token: ${{ github.token }}
          path: male_voice_demos
      - name: Render missing male voice samples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
        run: |
          pip install --quiet requests lameenc
          python -u tools/gemini_male_audition_resume.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postal-edge-hindi-male-voice-demos
          path: |
            male_voice_demos/*.mp3
            male_voice_demos/*.json
          retention-days: 30
