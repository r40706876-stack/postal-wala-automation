name: Postal Edge Hindi male voice auditions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/male_voice_auditions.yml'
permissions:
  contents: read
concurrency:
  group: postal-male-voice-auditions
  cancel-in-progress: false
jobs:
  audition:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          sparse-checkout: tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          pip install requests
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/cache/restore@v4
        with:
          path: male_voice_demos
          key: male-auditions-v1-${{ hashFiles('tools/gemini_male_audition.py') }}
          restore-keys: male-auditions-v1-
      - name: Discover and render all Hindi male auditions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        run: python -u tools/gemini_male_audition.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: male_voice_demos
          key: male-auditions-v1-${{ hashFiles('tools/gemini_male_audition.py') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postal-edge-hindi-male-voice-demos
          path: male_voice_demos/
          retention-days: 30
