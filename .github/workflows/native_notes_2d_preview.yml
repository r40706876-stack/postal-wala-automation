name: Postal Edge native 08:30 Notes preview with 2D characters
on:
  push:
    branches: [preview/native-notes-2d-20261121]
    paths:
      - .github/workflows/native_notes_2d_preview.yml
      - notes-2d-preview/**
permissions:
  actions: read
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation
          sparse-checkout: notes-2d-preview
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          ref: 3eb47fae010705252af08ac57cf0d04887f423b1
          token: ${{ secrets.CORE_TOKEN }}
          path: core
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /brand_config.json
            /assets/notes_intro_galti.mp4
            /assets/web_band.png
            /handnotes/*.html
            /handnotes/style.css
            /handnotes/brand/**
            /notes_reels/state.json
            /reels/src/notes_scene.html
            /reels/src/render.py
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Set up Notes browser, fonts and media tools
        timeout-minutes: 7
        run: |
          python -m pip install --timeout 25 --retries 2 playwright==1.47.0 numpy scipy requests pypdf pillow edge-tts imageio-ffmpeg
          python -m playwright install chromium
          if ! python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); p.chromium.launch().close(); p.stop()'; then
            python -m playwright install-deps chromium
          fi
          if ! command -v ffmpeg >/dev/null; then
            mkdir -p "$RUNNER_TEMP/notes-tools"
            ln -s "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/notes-tools/ffmpeg"
            echo "$RUNNER_TEMP/notes-tools" >> "$GITHUB_PATH"
          fi
          font_dir="$HOME/.local/share/fonts/postal-notes"
          mkdir -p "$font_dir"
          font_source="https://raw.githubusercontent.com/google/fonts/main/ofl"
          curl -fsSL --max-time 25 --retry 1 "$font_source/kalam/Kalam-Regular.ttf" -o "$font_dir/Kalam-Regular.ttf"
          curl -fsSL --max-time 25 --retry 1 "$font_source/kalam/Kalam-Bold.ttf" -o "$font_dir/Kalam-Bold.ttf"
          fc-cache -f "$font_dir"
      - name: Build with the morning Notes workflow and animate only the characters
        working-directory: core
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_DEEP_KEY || secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_TTS_KEYS: ${{ secrets.GEMINI_API_KEY_2 }},${{ secrets.GEMINI_API_KEY_3 }},${{ secrets.GEMINI_API_KEY_4 }},${{ secrets.GEMINI_API_KEY }}
          NOTES_GEMINI_ONLY: "1"
          NOTES_MAX_SEC: "58"
        run: |
          python ../automation/notes-2d-preview/prepare.py
          NOTES_CUSTOM=../automation/notes-2d-preview/clause_13_14.json python notes_reel.py build --demo "01:खराब और नकली टिकट:hi"
          mkdir -p ../result
          videos=(notes_reels/demo_*_hi.mp4)
          test "${#videos[@]}" -eq 1
          preview=../result/Postal_Edge_Morning_Notes_Clause_13_14_2D.mp4
          python ../automation/notes-2d-preview/website_badge.py ../result/website-badge.png
          ffmpeg -y -v error -i "${videos[0]}" -i ../result/website-badge.png -filter_complex "[0:v][1:v]overlay=(W-w)/2:100[out]" -map "[out]" -map 0:a -c:v libx264 -threads 4 -preset fast -crf 18 -c:a copy -movflags +faststart "$preview"
          rm ../result/website-badge.png
          cp "${videos[0]%.mp4}_cover.jpg" ../result/cover.jpg
          cp "${videos[0]%.mp4}_caption.txt" ../result/caption.txt
          ffmpeg -v error -xerror -i "$preview" -f null -
          if command -v ffprobe >/dev/null; then ffprobe -v error -show_entries stream=codec_name,width,height:format=duration -of compact "$preview"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: postal-edge-native-notes-clause-13-14-2d
          path: result/
          if-no-files-found: error
          retention-days: 7
