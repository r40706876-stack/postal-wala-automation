name: Deep class 3D clips (ek baar)

# v39 (2026-11-12): Bhaiya/Golu ke paardarshi 3D clips + 3D daakghar establishing shot.
# Ek baar banao -> deep/clips/<naam>/ (webp) -> har deep class video me lagte hain.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        clip: [golu_chauka, golu_sochta, golu_facepalm, golu_taali, golu_khush, bhaiya_ishara, bhaiya_batata, bhaiya_shabaash, establish]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
      - name: Blender 4.2
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 xvfb libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 python3-pil
          mkdir -p "$RUNNER_TEMP/blender"
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 25 -o "$RUNNER_TEMP/blender.tar.xz" \
            "https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
      - name: Render
        run: |
          CLIP=${{ matrix.clip }} xvfb-run -a "$RUNNER_TEMP/blender/blender" -b -t 4 --python deep/b3d_deep_clips.py 2>&1 \
            | { grep -E "DEEP_CLIP|Error|Traceback" || true; } | tail -n 20
          ls deep/clips_raw/${{ matrix.clip }} | wc -l
      - name: webp me (chhota)
        run: |
          python3 - <<'PY'
          import os, glob
          from PIL import Image
          c = "${{ matrix.clip }}"
          src = sorted(glob.glob(f"deep/clips_raw/{c}/f_*.png"))
          os.makedirs(f"deep/clips/{c}", exist_ok=True)
          for i, f in enumerate(src):
              im = Image.open(f)
              if c == "establish":
                  im.convert("RGB").save(f"deep/clips/{c}/f{i:03d}.webp", quality=82)
              else:
                  im.save(f"deep/clips/{c}/f{i:03d}.webp", quality=85)   # RGBA - paardarshi
          print("webp", c, len(src))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: clip-${{ matrix.clip }}
          path: deep/clips/${{ matrix.clip }}/
          retention-days: 3

  save:
    needs: render
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: clip-*
          path: dl
      - name: Commit
        run: |
          mkdir -p deep/clips
          for d in dl/clip-*; do n=${d#dl/clip-}; rm -rf deep/clips/$n; mkdir -p deep/clips/$n; cp $d/* deep/clips/$n/; done
          du -sh deep/clips
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add deep/clips
          git diff --staged --quiet || git commit -m "Deep class 3D clips [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep 10; done
